[package]
name = "patina-doctor"
version = "0.1.0"
edition = "2021"
description = "Health check command plugin for Patina"

[lib]
crate-type = ["cdylib"]

[dependencies]
patina-sdk = { path = "../../sdk/patina-sdk", features = ["command"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
