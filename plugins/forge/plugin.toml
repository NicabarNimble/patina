[plugin]
name = "patina-forge"
version = "0.1.0"
description = "GitHub connector — syncs issues and pull requests via REST API"
world = "mother-child"
role = "connector"
patina_min = "0.39.0"

[capabilities]
host_log = true
host_emit = true
host_http = ["api.github.com"]

[capabilities.host_secrets]
"api.github.com" = { secret = "github-token", location = "bearer" }

[provides]
child = "forge"

[schemas.forge]
package = "patina:schema/forge@1.0.0"
