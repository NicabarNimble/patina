[package]
name = "patina-pipe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native transport binding for Patina pipe protocol — Child trait, run(), FactEmitter over stdio JSON-RPC"
repository = "https://github.com/NicabarNimble/patina"

[features]
http-proxy = ["reqwest", "anyhow"]

[dependencies]
anyhow = { version = "1", optional = true }
patina-pipe-types = { path = "../patina-pipe-types" }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Unix: libc for fork-based sandbox tests + Linux runtime
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux-only: Landlock ABI v4+ for native child sandboxing
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
