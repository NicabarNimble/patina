name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-assets:
    name: Build release assets (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build patina binary
        run: cargo build --release --locked --bin patina

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/patina dist/patina
          chmod +x dist/patina
          tar -czf "patina-${{ matrix.target }}.tar.gz" -C dist patina

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "patina-${{ matrix.target }}.tar.gz" > "checksums-${{ matrix.target }}.txt"
          else
            shasum -a 256 "patina-${{ matrix.target }}.tar.gz" > "checksums-${{ matrix.target }}.txt"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            patina-${{ matrix.target }}.tar.gz
            checksums-${{ matrix.target }}.txt

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-assets

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Merge checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/checksums-*.txt > dist/checksums.txt
          ls -lah dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/patina-*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
