[workspace]
members = [".", "mother", "sdk/patina-sdk", "sdk/patina-sdk-legacy", "children/belief-verifier", "children/session-writer", "children/spec-manager", "children/slate-manager", "children/doctor", "children/file-system-monitor", "children/content-extractor", "children/schema-enforcer", "children/dedup-filter", "children/parquet-writer", "children/lakehouse-catalog", "children/legacy-typed-bridge", "adapters/fsm-pando", "adapters/ce-pando", "adapters/se-pando", "adapters/df-pando", "adapters/rw-pando", "adapters/lc-pando", "crates/patina-core", "crates/patina-protocol"]
exclude = ["layer/dust", "sdk/template"]
resolver = "2"

[package]
name = "patina-ai"
version = "0.67.0"
edition = "2021"
license = "MIT"
description = "Context orchestration for AI development - captures and evolves patterns over time"
repository = "https://github.com/NicabarNimble/patina"
keywords = ["ai", "development", "patterns", "context", "embeddings"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["bundled-doctor", "duckdb-bundled"]
bundled-doctor = []  # Compiled-in doctor fallback — disable for smaller binary (WASM-only doctor)
duckdb-bundled = ["duckdb/bundled"]  # Compile DuckDB from C++ source (~1.3GB debug). Default on for local dev (no system lib needed). CI always installs prebuilt libduckdb as a system fallback; bundled feature compiles from source regardless but prebuilt ensures non-bundled paths also link.
dev = []  # Developer commands - not included in user builds

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Filesystem
dirs = "5.0"
shellexpand = "3.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Environment detection
which = "7.0"

# HTTP client (blocking only - no async)
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
hyper = "1"

# HTTP request parser (zero-copy, zero deps) — blocking microserver
httparse = "1.10"

# File watching
notify = "6.1"

# Database - embedded SQLite for pattern storage and semantic analysis
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "load_extension"] }

# Parallel processing (better than async for our use case)
rayon = "1.10"

# Simple synchronization
parking_lot = "0.12"  # Faster mutexes

# Random number generation (lightweight, no dependencies)
fastrand = "2.0"

# Navigation command dependencies
colored = "2"

# Filesystem patterns
glob = "0.3"

# YAML support for docker-compose generation
serde_yaml = "0.9"

walkdir = "2"
ignore = "0.4"

# Tree-sitter removed — Rust fallback uses embedded WASM grammar via PipelineEngine.
# See EMBEDDED_GRAMMAR_RUST in src/commands/scrape/code/extract.rs.

# Structured logging (MCP server — file-based JSON)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# Embeddings and vector search
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }  # ONNX Runtime - pinned, rc.11 breaks API
tokenizers = "0.15"                                                  # HuggingFace tokenizers (Rust)
ndarray = "0.16"                                                     # Array operations for embeddings
usearch = "2.21"                                                     # Fast vector similarity search (HNSW index)
safetensors = "0.7"                                                  # Standard weight format (MLX-compatible, HuggingFace)
zerocopy = "0.7"                                                     # Efficient vector byte conversion
regex = "1.12.2"
# DuckDB Rust crate version encoding (changed at v1.5.0):
#   Before v1.5.0: crate version = DuckDB version (e.g. 1.4.4 = DuckDB v1.4.4)
#   From v1.5.0:   1.{MAJOR}{MINOR_2d}{PATCH_2d}.{crate_patch} (e.g. 1.10501.0 = DuckDB v1.5.1)
# To upgrade: find new crate version on crates.io, update here AND update CI prebuilt
#   in .github/workflows/test.yml (wget URL) to the matching DuckDB release.
duckdb = { version = "1.10501" }  # DuckDB v1.5.1

# WASM plugin runtime
wasmtime = { version = "=41", default-features = false, features = [
    "runtime",          # Execution engine (required)
    "cranelift",        # JIT compiler backend
    "component-model",  # WIT Component Model support
] }
# WASI support — wasm32-wasip2 components always import basic WASI (stdio, env, clocks)
# even for pure-computation code. p2 feature = WASIp2 component model.
wasmtime-wasi = { version = "=41", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=41", default-features = false, features = ["default-send-request"] }
wac-graph = "0.9.0"

mother-crate = { package = "mother", path = "mother" }
patina-core = { path = "crates/patina-core" }
patina-protocol = { path = "crates/patina-protocol" }

# Secrets CLI client/runtime
sha2 = "0.10"  # ONNX model integrity verification (already in tree via age)
console = "0.15"  # Masked input for secrets (already in tree)
zeroize = "1.8"  # Zero key material after use (already in tree via age)
atty = "0.2"  # TTY detection for interactive prompts

# Unix-only: fork/setsid for background sync
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Testing utilities
tempfile = "3.14"
approx = "0.5"  # Testing similarity scores
patina-ai-child-slate-manager = { path = "children/slate-manager" }

[[bin]]
name = "patina"
path = "src/main.rs"

[lib]
name = "patina"
path = "src/lib.rs"
