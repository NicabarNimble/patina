# Oxidize Recipe - Multi-Domain (Phase 5b)
# Build embeddings for knowledge + session domains

version: 1
embedding_model: e5-base-v2

projections:
  # Knowledge projection - beliefs, patterns, and commit messages
  # Training signal: commit-based pairs (baseline)
  # Phase 5a: corpus optimized (enriched text, filtered commits)
  knowledge:
    layers: [768, 1024, 256]
    epochs: 10
    batch_size: 32

  # Session projection - decisions, patterns, work, context from sessions
  # Phase 5b: new domain proving session reasoning is retrievable
  # Training signal: commit-based pairs (reuses knowledge training)
  sessions:
    layers: [768, 1024, 256]
    epochs: 10
    batch_size: 32

  # Temporal projection - files that co-change are related
  temporal:
    layers: [768, 1024, 256]
    epochs: 10
    batch_size: 32

  # Dependency projection - functions that call each other are related
  dependency:
    layers: [768, 1024, 256]
    epochs: 10
    batch_size: 32
