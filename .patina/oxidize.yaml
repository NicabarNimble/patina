# Oxidize Recipe - Knowledge Domain (Phase 2)
# Build embeddings from beliefs + patterns + commits

version: 1
embedding_model: e5-base-v2

projections:
  # Knowledge projection - beliefs, patterns, and commit messages
  # Training signal: commit-based pairs (baseline)
  knowledge:
    layers: [768, 1024, 256]
    epochs: 10
    batch_size: 32

  # Temporal projection - files that co-change are related
  temporal:
    layers: [768, 1024, 256]
    epochs: 10
    batch_size: 32

  # Dependency projection - functions that call each other are related
  dependency:
    layers: [768, 1024, 256]
    epochs: 10
    batch_size: 32
