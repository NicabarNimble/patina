[package]
name = "patina-metal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tree-sitter based code parsing for patina-ai"
repository = "https://github.com/NicabarNimble/patina"

include = ["src/**", "grammars/**", "queries/**", "build.rs", "Cargo.toml", "grammar-pack.toml"]

[dependencies]
tree-sitter = "0.24"
streaming-iterator = "0.1"
anyhow = "1.0"
once_cell = "1.19"
cairo-lang-parser = "2.12"
cairo-lang-syntax = "2.12"
cairo-lang-filesystem = "2.12"

[build-dependencies]
cc = "1.0"
