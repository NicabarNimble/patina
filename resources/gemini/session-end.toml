description = "End and archive the current session"
prompt = """
End and archive the current Patina session:

1. Run `/session-update` first if recent work has not been captured yet.

2. Execute the bundled session end wrapper:
   `.gemini/bin/session-end.sh`

3. Read the returned JSON and confirm:
   - archive artifact path
   - classification
   - start/end tags
   - that `last_session_path` now points to this durable session

4. Ask the user if they'd like to:
   - Review the session summary
   - Commit any remaining changes
   - Start a new session

The session work is now preserved in project history.
"""
