[package]
name = "mother"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Patina Mother daemon crate"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.10", features = ["v4"] }
httparse = "1.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
