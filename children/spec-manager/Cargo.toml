[package]
name = "patina-ai-child-spec-manager"
version = "0.1.0"
edition = "2021"
description = "Spec lifecycle manager knowledge child for Mother"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patina-sdk = { package = "patina-sdk-legacy", path = "../../sdk/patina-sdk-legacy", features = ["child", "toy-log", "toy-state", "toy-git"] }
serde_json = "1.0"

[package.metadata.component]
package = "patina:spec-manager"

[package.metadata.component.target]
path = "../../wit/child"
world = "child"
