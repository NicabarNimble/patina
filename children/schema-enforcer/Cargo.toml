[package]
name = "patina-ai-child-schema-enforcer"
version = "0.1.0"
edition = "2021"
description = "Validate extracted records against schema"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patina-sdk = { path = "../../sdk/patina-sdk", features = ["child", "toy-log", "toy-messaging", "toy-measure"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.component]
package = "patina:schema-enforcer"

[package.metadata.component.target]
path = "../../wit/child"
world = "child"
