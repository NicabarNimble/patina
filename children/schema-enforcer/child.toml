[child]
name = "schema-enforcer"
kind = "child"
role = "app"

[needs]
toys = ["logging", "events", "messaging", "measure"]

[needs.scopes.events]
subscribe = ["record.extracted"]

[needs.metrics]
provenance_complete_records = { type = "counter", labels = [] }
provenance_incomplete_records = { type = "counter", labels = [] }
provenance_completeness_pct = { type = "gauge", labels = [] }
