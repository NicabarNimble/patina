[package]
name = "patina-ai-child-session-writer"
version = "0.1.0"
edition = "2021"
description = "Session artifact writer knowledge child for Mother"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patina-sdk = { path = "../../sdk/patina-sdk", features = ["knowledge-child", "toy-log", "toy-state", "toy-session"] }
serde_json = "1.0"

[package.metadata.component]
package = "patina:session-writer"

[package.metadata.component.target]
path = "../../wit/worlds"
world = "session-writer"
