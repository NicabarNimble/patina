[package]
name = "patina-ai-child-folder-text-to-parquet"
version = "0.1.0"
edition = "2021"
description = "Composite folder text scan child for Step 1 prototype"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patina-sdk = { path = "../../sdk/patina-sdk", features = ["knowledge-child", "toy-log", "toy-state"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4"] }
arrow-array = "55"
arrow-schema = "55"
parquet = { version = "55", default-features = false, features = ["arrow"] }

[package.metadata.component]
package = "patina:folder-text-to-parquet"

[package.metadata.component.target]
path = "../../wit/knowledge-child"
world = "knowledge-child"
