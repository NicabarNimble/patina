[plugin]
name = "patina-belief-verifier"
version = "0.1.0"
description = "Belief verification knowledge child for Mother"
world = "knowledge-child"
role = "app"
patina_min = "0.41.0"

[capabilities]
host_log = true
host_measure = true

[capabilities.state]
enabled = true

[capabilities.checkpoint]
streams = ["belief.changed"]

[capabilities.events]
subscribe = ["belief.changed"]

[capabilities.tasks]
intents = ["verify-belief"]

[capabilities.belief]
read = true
write = ["record-verification", "attach-evidence"]

[toys]
belief = true
measure = true

[provides]
child = "belief-verifier"
