[child]
name = "github-connector"
version = "0.1.0"
type = "connector"
runtime = "native"
lifecycle = "poll"
description = "GitHub issues and pull requests via REST API"

[capabilities]
data_types = ["issues", "prs"]
supports_incremental = true

[domains]
allowed = ["api.github.com"]

[auth]
required = true
provider = "github"

[schemas.github]
package = "patina:schema/github@1.0.0"
