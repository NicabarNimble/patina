[plugin]
name = "patina-ducklake"
version = "0.1.0"
description = "Canonical DuckLake knowledge child for Mother"
world = "knowledge-child"
role = "app"
patina_min = "0.41.0"

[capabilities]
host_log = true
host_measure = true

[capabilities.state]
enabled = true

[capabilities.checkpoint]
streams = ["ducklake.sync"]

[capabilities.tasks]
intents = ["fetch-source"]

[toys]
lake = ["default"]
measure = true

[toys.connector]
enabled = true

[provides]
child = "ducklake"
