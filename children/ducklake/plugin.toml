[plugin]
name = "patina-ducklake"
version = "0.1.0"
description = "Canonical DuckLake knowledge child for Mother"
world = "knowledge-child"
role = "app"
patina_min = "0.41.0"

[needs]
toys = ["log", "state", "checkpoint", "lake", "connector", "measure", "task"]

[needs.scopes.checkpoint]
streams = ["ducklake.sync"]

[needs.scopes.lake]
names = ["default"]

[needs.scopes.task]
intents = ["fetch-source"]

[provides]
child = "ducklake"
