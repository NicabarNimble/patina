[package]
name = "patina-ai-child-ducklake"
version = "0.1.0"
edition = "2021"
description = "Canonical DuckLake knowledge child for Mother"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patina-sdk = { path = "../../sdk/patina-sdk", features = ["knowledge-child", "toy-log", "toy-state", "toy-task", "toy-measure", "toy-checkpoint", "toy-lake", "toy-connector"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.component]
package = "patina:ducklake"

[package.metadata.component.target]
path = "../../wit/worlds"
world = "ducklake"
