[package]
name = "ducklake"
version = "0.1.0"
edition = "2021"
description = "Autonomous DuckDB + DuckLake data lake child"

[dependencies]
patina-pipe = { path = "../../crates/patina-pipe", features = ["http-proxy"] }
patina-pipe-types = { path = "../../crates/patina-pipe-types" }
duckdb = { version = "1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
which = "7"

[[bin]]
name = "ducklake"
path = "src/main.rs"
