[package]
name = "patina-ai-child-content-extractor"
version = "0.1.0"
edition = "2021"
description = "Extract structured records from discovered files"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patina-sdk = { path = "../../sdk/patina-sdk", features = ["knowledge-child", "toy-log"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4"] }

[package.metadata.component]
package = "patina:content-extractor"

[package.metadata.component.target]
path = "../../wit/knowledge-child"
world = "knowledge-child"
