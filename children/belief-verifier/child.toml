[child]
name = "patina-belief-verifier"
version = "0.1.0"
description = "Belief verification knowledge child for Mother"
kind = "child"
role = "app"
patina_min = "0.41.0"

[needs]
toys = ["log", "state", "store", "events", "task"]

[needs.connections]
beliefs = { toy = "store" }

[needs.scopes.checkpoint]
streams = ["belief.changed"]

[needs.scopes.events]
subscribe = ["belief.changed"]

[needs.scopes.task]
intents = ["verify-belief"]

[needs.scopes.belief]
read = true
write = ["record-verification", "attach-evidence"]

[provides]
child = "belief-verifier"

[relationships]
emits = []
listens = []
