[package]
name = "patina-ai-child-lake-manager"
version = "0.1.0"
edition = "2021"
description = "Lake manager knowledge child for Mother"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patina-sdk = { path = "../../sdk/patina-sdk", features = ["child", "toy-log", "toy-state"] }
serde_json = "1.0"

[package.metadata.component]
package = "patina:lake-manager"

[package.metadata.component.target]
path = "../../wit/child"
world = "child"
