[child]
name = "dedup-filter"
kind = "child"
role = "app"

[needs]
toys = ["log", "events", "state", "measure"]

[needs.scopes.events]
subscribe = ["record.validated"]

[needs.metrics]
records_seen = { type = "counter", labels = [] }
ready_records = { type = "counter", labels = [] }
duplicate_records = { type = "counter", labels = [] }
duplicate_output_rate_pct = { type = "gauge", labels = [] }
