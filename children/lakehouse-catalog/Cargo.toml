[package]
name = "patina-ai-child-lakehouse-catalog"
version = "0.1.0"
edition = "2021"
description = "Register parquet outputs in catalog metadata"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.41.0"
patina-sdk = { path = "../../sdk/patina-sdk" }
chrono = "0.4"

[package.metadata.component]
package = "patina:lakehouse-catalog"

[package.metadata.component.target]
path = "wit"
world = "lakehouse-catalog"
