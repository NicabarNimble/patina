[package]
name = "patina-ai-child-file-system-monitor"
version = "0.1.0"
edition = "2021"
description = "File discovery child for folder-text-to-parquet split"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.41.0"
patina-sdk = { path = "../../sdk/patina-sdk" }
chrono = "0.4"
sha2 = "0.10"

[package.metadata.component]
package = "patina:file-system-monitor"

[package.metadata.component.target]
path = "wit"
world = "file-system-monitor"
