[schema]
name = "github"
version = "1.0.0"
package = "patina:schema/github@1.0.0"
description = "GitHub issues and pull requests (via github-connector)"

# Fact types produced by this schema.
# Each maps a logical name to an event type and WIT record.

[[facts]]
name = "issue"
event_type = "github.issue"
record = "issue"

[[facts]]
name = "pull-request"
event_type = "github.pr"
record = "pull-request"

# Embedding configuration.
# offset_slot indexes into embeddings::offsets (slot 5 = FORGE_ID_OFFSET).
# Shares slot 5 with forge — both are code-hosting-platform events,
# and seq is unique across eventlog so no key collisions.
# corpus_query is the SQL used by oxidize to build the embedding corpus.

[embedding]
offset_slot = 5
corpus_query = """
SELECT seq,
       json_extract(data, '$.title') || ' ' ||
       COALESCE(json_extract(data, '$.body'), '')
       as content
FROM eventlog
WHERE event_type LIKE 'github.%'
"""

# Index configuration per fact type.
# Defines FTS5 fields and materialized view tables.
# Shares tables with forge — both project into forge_issues/forge_prs.

[[indexes]]
fact = "issue"
fts_fields = ["title", "body"]
table = "forge_issues"

[[indexes]]
fact = "pull-request"
fts_fields = ["title", "body", "comments"]
table = "forge_prs"
