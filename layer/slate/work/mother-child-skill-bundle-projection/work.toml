    """
[ ] A capability matrix exists for each HITL and is used at runtime to resolve scope paths and behavior (project/global support, projection roots, conflict/override, marker/update, executable handling).
[ ] `patina mother skills status` reports child source state and projection state per scope (project/global) deterministically for at least one installed child.
[ ] Project-scope install writes only expected Mother-managed files into chosen HITL/project path and records them in scope lock state.
[ ] Global install (`--global`) succeeds only for HITLs that declare support; unsupported HITLs fail with actionable error and zero writes.
[ ] `patina mother skills sync <child>` is idempotent in both project and global scopes (second run no-op when source unchanged).
[ ] `patina mother skills uninstall <child>` removes only tracked Mother-managed artifacts for selected scope and preserves unmanaged/user files.
[ ] Conflict behavior is safe: `--dry-run` previews exact actions; non-dry-run fails closed with no partial writes when collisions are disallowed.
[ ] Automated tests include parser/dispatch coverage plus at least one filesystem roundtrip for project scope and one for global-scope capability gating.""",
