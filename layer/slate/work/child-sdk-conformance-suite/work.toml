id = "child-sdk-conformance-suite"
title = "Build child SDK conformance suite"
kind = "build"
status = "draft"
human_request = "Create a full language-neutral SDK-side child conformance suite so child developers can verify package, manifest, WIT/component, toys/scopes, skills, smoke behavior, and release artifacts have not drifted from Patina usability boundaries."
allium_anchors = ["layer/allium/mother/mother-mct-test-harness.allium"]
user_alignment = "The user wants stronger testing and verification within the current SDK structure without exploding command surfaces, focused on the WASM/WASI/WIT connecting edges rather than Rust-specific child internals."
belief_refs = ["mother-harness-separates-child-fixtures-from-scenarios"]
proof_plan = [
    """
[ ] SDK-side conformance suite exists as a reusable language-neutral boundary verifier rather than a Rust-only source checker or expanded operational CLI surface.
[ ] Manifest conformance validates `child.toml` required identity fields, `patina_min`, ingress/contract/default/allowlist, `[needs].toys`, optional `[needs.scopes]`, and rejects legacy `[capabilities]` / top-level `[toys]` manifests.
[ ] Component/WIT conformance can inspect a built WASM component without live Mother and compare exports/imports against manifest contract and declared toys.
[ ] Skills bundle conformance validates `skills/*/SKILL.md` Mother-discoverable structure, required metadata, stable names, and collision-prone layouts.
[ ] Smoke/report layer produces human/LLM-friendly actionable findings and a machine-readable conformance report suitable for child CI and future Mother approval intake.
[ ] Tests cover successful and failing fixture packages without assuming child implementation language internals.
""",
]
