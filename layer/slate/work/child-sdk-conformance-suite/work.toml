id = "child-sdk-conformance-suite"
title = "Build child SDK conformance suite"
kind = "build"
status = "active"
human_request = "Create a full language-neutral SDK-side child conformance suite so child developers can verify package, manifest, WIT/component, toys/scopes, skills, smoke behavior, and release artifacts have not drifted from Patina usability boundaries."
allium_anchors = [
    "layer/allium/mother/mother-mct-test-harness.allium",
    "layer/slate/work/child-sdk-conformance-suite/allium/child-sdk-diagnostic-model.allium",
]
user_alignment = "The user wants stronger testing and verification within the current SDK structure without exploding command surfaces, focused on the WASM/WASI/WIT connecting edges rather than Rust-specific child internals."
belief_refs = ["mother-harness-separates-child-fixtures-from-scenarios"]
proof_plan = ["""
[ ] SDK-side conformance suite exists as a reusable language-neutral boundary verifier rather than a Rust-only source checker or expanded operational CLI surface.
[ ] Manifest conformance validates `child.toml` required identity fields, `patina_min`, ingress/contract/default/allowlist, `[needs].toys`, optional `[needs.scopes]`, and rejects legacy `[capabilities]` / top-level `[toys]` manifests.
[ ] Component/WIT conformance can inspect a built WASM component without live Mother and compare exports/imports against manifest contract and declared toys.
[ ] Skills bundle conformance validates `skills/*/SKILL.md` Mother-discoverable structure, required metadata, stable names, and collision-prone layouts.
[ ] Smoke/report layer produces human/LLM-friendly actionable findings and a machine-readable conformance report suitable for child CI and future Mother approval intake.
[ ] Tests cover successful and failing fixture packages without assuming child implementation language internals.
"""]
closure_evidence = [
    "Created this Slate after reviewing current `sdk/patina-sdk` structure: it currently provides typed WIT-facing types, toy helper wrappers, a Rust child template, and toy governance docs, but no coherent SDK-side child conformance harness.",
    "Reviewed existing conformance-like repo tests (`tests/mother_typed_fixture_conformance.rs`, `tests/child_init_typed_default.rs`, `tests/wit_deps_multifile.rs`, and Mother skill fixtures) and confirmed they are useful foundations but are scattered internal tests rather than a child-developer suite.",
    "Validated current child upgrade pressure with Slate child `v0.2.0`: source release metadata is now aligned (`Cargo.toml` and `child.toml` both `0.2.0`), but Mother registry discovery required GitHub release assets to include `child.toml` plus checksum coverage for both manifest and WASM component.",
    "Repaired Slate child `v0.2.0` release assets on GitHub by uploading `child.toml`, `child.toml.sha256`, and `checksums.txt`; `patina mother children sync` then discovered `slate-manager@0.2.0`, and Mother approved, installed, and assigned it to project `2bdc808e` with audit events.",
    "Updated the external Slate child release workflow in `/Users/nicabar/Projects/Patina/patina-child-slate` so future tag releases publish Mother registry assets (`.wasm`, `child.toml`, sidecar hashes, and `checksums.txt`); external commit `16a92a8` pushed to `origin/main`.",
    "Added Slate-local Allium diagnostic model at `layer/slate/work/child-sdk-conformance-suite/allium/child-sdk-diagnostic-model.allium`, organized by manifest, WIT, component, and release phases with compiler-style diagnostic finding shape and Preview 3 expansion questions.",
    "Tended the diagnostic model so release diagnostics are gated by `DiagnosticStage.release_candidate`; missing release bundle evidence is now a release-candidate error rather than a local-development warning.",
    "Tended diagnostic stages to separate `local_dev`, `component_built`, and `release_candidate`, so local development can validate manifest/WIT without requiring a built WASM component artifact.",
    "Added SDK-adjacent crate `sdk/patina-child-diagnostics` as a reusable library rather than a `patina` binary command; first slice covers local-dev manifest and WIT diagnostics.",
    "Implemented report model with stage, phase, severity, diagnostic code, optional location, message, help, text rendering, and `assert_ok()` for child repo tests.",
    "Implemented manifest diagnostics for missing `child.toml`, missing `[child]` identity fields, legacy `[capabilities]`, legacy top-level `[toys]`, and missing/non-array `[needs].toys`.",
    "Implemented WIT diagnostics using `wit-parser` for package/world resolution, missing exports, known toy import mapping, unknown import warnings, and toy import mismatch errors against `[needs].toys`.",
    "Added fixture-backed local-dev tests proving valid child packages pass without built component/release assets and failing fixtures report legacy manifest, missing toy need, and unresolved WIT diagnostics.",
    "Validated first diagnostic slice with `cargo test -p patina-child-diagnostics`, `cargo clippy -p patina-child-diagnostics --all-targets -- -D warnings`, `cargo fmt --check`, and `allium check layer/slate/work/child-sdk-conformance-suite/allium`.",
    "Added repo-local `.patina/children-dev.toml` support to `patina-child-diagnostics`, with plural `[children.<name>]` entries for one or more child packages, required `root`, and optional `component` fields.",
    "Established `.patina/dev/` as the ignored repo-local SDK dev artifact root so generated component/check outputs can be cleaned without assuming Rust Cargo `target/` layout.",
    "Added children-dev aggregate reporting that runs existing local-dev manifest/WIT diagnostics for each configured child root and warns when configured component paths are outside repo-local `.patina/dev/`.",
    "Added single-child and multi-child children-dev fixtures and tests proving the config works with optional component paths and `.patina/dev/components/<child>.wasm` conventions without requiring built artifacts.",
]
