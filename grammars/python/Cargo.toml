[package]
name = "grammar-python"
version = "0.1.0"
edition = "2021"
description = "Python grammar extraction plugin for Patina pipeline (tree-sitter + wasi-sdk)"

[lib]
crate-type = ["cdylib"]

[dependencies]
patina-sdk = { version = "0.21", features = ["pipeline"] }
tree-sitter = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1"

[workspace]
