[package]
name = "grammar-cairo"
version = "0.1.0"
edition = "2021"
description = "Cairo grammar extraction plugin for Patina pipeline"

[lib]
crate-type = ["cdylib"]

[dependencies]
patina-sdk = { version = "0.21", features = ["pipeline"] }
cairo-lang-parser = "2.12"
cairo-lang-syntax = "2.12"
cairo-lang-filesystem = "2.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
