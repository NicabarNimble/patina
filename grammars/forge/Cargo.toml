[package]
name = "grammar-forge"
version = "0.1.0"
edition = "2021"
description = "Forge staging file extraction plugin for Patina pipeline"

[lib]
crate-type = ["cdylib"]

[dependencies]
patina-sdk = { version = "0.21", features = ["pipeline"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]
