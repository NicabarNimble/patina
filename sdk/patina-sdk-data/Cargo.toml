[package]
name = "patina-sdk-data"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "MIT"
description = "Data toy primitives for Patina knowledge children"
repository = "https://github.com/NicabarNimble/patina"
keywords = ["patina", "wasm", "knowledge-child"]
categories = ["development-tools", "wasm"]

[features]
default = []
toy-lake = []
toy-checkpoint = []
toy-measure = []
toy-github = []
toy-connector = []

[dependencies]
patina-sdk-core = { path = "../patina-sdk-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
