[package]
name = "patina-sdk"
version = "0.21.0"
edition = "2021"
license = "MIT"
description = "SDK for building Patina WASM plugins — task, command, pipeline, and mother-child worlds"
repository = "https://github.com/NicabarNimble/patina"
keywords = ["patina", "wasm", "plugin", "component-model"]
categories = ["development-tools", "wasm"]

# Ensure WIT files and license ship with the published crate
include = ["src/**", "wit/**", "Cargo.toml", "README.md", "LICENSE*"]

[features]
default = []
task = []
command = []
mother-child = []
knowledge-child = [
    "dep:serde",
    "dep:serde_json",
    "dep:patina-sdk-core",
    "dep:patina-sdk-data",
    "dep:patina-sdk-agent",
    "toy-log",
    "toy-state",
]
toy-log = []
toy-state = []
toy-task = []
toy-fetch = []
toy-measure = ["patina-sdk-data/toy-measure"]
toy-query = ["patina-sdk-agent/toy-query"]
toy-emit = ["patina-sdk-agent/toy-emit"]
toy-checkpoint = ["patina-sdk-data/toy-checkpoint"]
toy-lake = ["patina-sdk-data/toy-lake"]
toy-ingress = []
toy-github = ["patina-sdk-data/toy-github"]
toy-connector = ["patina-sdk-data/toy-connector"]
toy-events = []
toy-peer = ["patina-sdk-core/toy-peer"]
toy-graph = []
toy-belief = []
toy-session = ["patina-sdk-agent/toy-session"]
pipeline = ["dep:serde", "dep:serde_json"]

[dependencies]
wit-bindgen = "0.41"
patina-sdk-core = { path = "../patina-sdk-core", optional = true }
patina-sdk-data = { path = "../patina-sdk-data", optional = true }
patina-sdk-agent = { path = "../patina-sdk-agent", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
