[package]
name = "patina-sdk"
version = "0.22.0"
edition = "2021"
license = "MIT"
description = "SDK for push-pure Patina WASM children"
repository = "https://github.com/NicabarNimble/patina"
keywords = ["patina", "wasm", "child", "component-model"]
categories = ["development-tools", "wasm"]
include = ["src/**", "wit/**", "Cargo.toml", "README.md", "TOY_GOVERNANCE.md", "LICENSE*"]

[features]
default = []
manifest = ["dep:serde", "dep:toml"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
wit-bindgen = "0.41"

[dev-dependencies]
tempfile = "3.14"
