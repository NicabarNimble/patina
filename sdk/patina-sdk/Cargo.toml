[package]
name = "patina-sdk"
version = "0.21.0"
edition = "2021"
license = "MIT"
description = "SDK for building Patina WASM children (knowledge-child first)"
repository = "https://github.com/NicabarNimble/patina"
keywords = ["patina", "wasm", "child", "component-model"]
categories = ["development-tools", "wasm"]

# Ensure WIT files and license ship with the published crate
include = ["src/**", "wit/**", "Cargo.toml", "README.md", "LICENSE*"]

[features]
default = []
# Canonical world for Mother/Child/Toy contract.
knowledge-child = [
    "dep:serde",
    "dep:serde_json",
    "toy-log",
    "toy-state",
]
toy-log = []
toy-state = []
toy-task = []
toy-fetch = []
toy-measure = []
toy-query = []
toy-emit = []
toy-checkpoint = []
toy-lake = []
toy-ingress = []
toy-github = []
toy-connector = []
toy-events = []
toy-peer = []
toy-graph = []
toy-belief = []
toy-session = []
toy-layer-fs = []
toy-git = []
pipeline = ["dep:serde", "dep:serde_json"]

[dependencies]
wit-bindgen = "0.41"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
