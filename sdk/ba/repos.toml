# Canonical Bytecode Alliance and WebAssembly repositories Patina tracks.
#
# Each entry is registered via `patina repo add <url>` by sdk/ba/scripts/add-all.sh.
# The script is idempotent — re-running skips already-registered repos.
#
# Priority levels:
#   high   — Patina actively uses or directly extends this. Track changes closely.
#   medium — Informs Patina design or covers adjacent territory. Track for awareness.
#   low    — Watch list. Useful context but not load-bearing.
#
# Add to this list when the Patina–BA relationship deepens. Removal requires
# justification in the commit message.

# ============================================================================
# Bytecode Alliance — host runtime, tooling, language SDKs
# ============================================================================

[[repos]]
url = "https://github.com/bytecodealliance/wasmtime"
priority = "high"
purpose = "WASM runtime — Patina's host for executing components"

[[repos]]
url = "https://github.com/bytecodealliance/wit-bindgen"
priority = "high"
purpose = "Generates language bindings from WIT — Patina uses for Rust"

[[repos]]
url = "https://github.com/bytecodealliance/wac"
priority = "high"
purpose = "WebAssembly Composition — Patina uses wac-graph for runtime composition"

[[repos]]
url = "https://github.com/bytecodealliance/wasm-tools"
priority = "high"
purpose = "WASM toolchain (validation, transformation, component encoding)"

[[repos]]
url = "https://github.com/bytecodealliance/jco"
priority = "medium"
purpose = "JavaScript component bindings — informs cross-language design"

[[repos]]
url = "https://github.com/bytecodealliance/wasm-pkg-tools"
priority = "medium"
purpose = "WASM package tooling — relevant for child distribution"

[[repos]]
url = "https://github.com/bytecodealliance/wasi-rs"
priority = "medium"
purpose = "Rust WASI bindings"

[[repos]]
url = "https://github.com/bytecodealliance/componentize-py"
priority = "low"
purpose = "Python → component — informs language-binding patterns"

[[repos]]
url = "https://github.com/bytecodealliance/componentize-js"
priority = "low"
purpose = "JS → component — informs language-binding patterns"

[[repos]]
url = "https://github.com/bytecodealliance/wasi-virt"
priority = "low"
purpose = "WASI virtualization — relevant for sandboxing patterns"

[[repos]]
url = "https://github.com/bytecodealliance/governance"
priority = "low"
purpose = "BA governance — meeting cadence, SG structure, decision process"

