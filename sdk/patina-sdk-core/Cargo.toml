[package]
name = "patina-sdk-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "MIT"
description = "Core primitives for Patina knowledge children"
repository = "https://github.com/NicabarNimble/patina"
keywords = ["patina", "wasm", "knowledge-child"]
categories = ["development-tools", "wasm"]

[features]
default = []
toy-peer = []

[dependencies]
wit-bindgen = "0.41"
serde = { version = "1.0", features = ["derive"] }
