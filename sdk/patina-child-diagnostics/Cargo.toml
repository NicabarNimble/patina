[package]
name = "patina-child-diagnostics"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SDK-adjacent diagnostics for Patina child packages"
repository = "https://github.com/NicabarNimble/patina"
keywords = ["patina", "wasm", "component-model", "wit", "diagnostics"]
categories = ["development-tools", "wasm"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
wasmparser = "0.244"
wit-parser = "0.244"

[dev-dependencies]
wasm-encoder = "0.244"
